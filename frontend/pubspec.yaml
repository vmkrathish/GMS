name: GMS
description: "GMS (Get My Service) — app to connect users with service providers, featuring real-time bookings, chat, payments, and profile management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.0.3
  shimmer: ^2.0.0

  # Core
  http: ^1.2.1
  http_parser: ^4.0.2
  provider: ^6.1.2
  shared_preferences: ^2.3.1

  # Maps / geo
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Media / crop
  image_picker: ^0.8.7+4
  crop_your_image: ^2.0.0
  path_provider: ^2.0.15

  # OTP + permissions
  flutter_otp_text_field: ^1.1.1
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  rename: ^3.1.0
  change_app_package_name: ^1.5.0

  intl: ^0.18.1
  just_audio: ^0.9.36
  video_player: ^2.8.2

  package_info_plus: ^8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # tools like launcher icons belong in dev_dependencies
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/country_codes.json
    - assets/images/gms_logo.png
    - assets/images/offline.png
    - assets/advertisement/
    - assets/currencies.json



flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/gms_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/gms_logo.png"